[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrot-model"
version = "0.1.0"
description = "A local, mock LLM provider for development and testing of LLM-powered applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Parrot Model Contributors" }
]
keywords = ["llm", "mock", "testing", "pydantic-ai", "langchain", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai>=0.1.0",
]
langchain = [
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
all = [
    "parrot-model[pydantic-ai,langchain,dev]",
]

[project.urls]
Homepage = "https://github.com/parrot-model/parrot-model"
Documentation = "https://github.com/parrot-model/parrot-model#readme"
Repository = "https://github.com/parrot-model/parrot-model"
Issues = "https://github.com/parrot-model/parrot-model/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parrot_model"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["parrot_model"]
